version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 021913935619.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo Building Docker image...
      - docker build -t ecs-node-app .
      - docker tag ecs-node-app:latest 021913935619.dkr.ecr.ap-south-1.amazonaws.com/ecs-node-app:latest

  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      - docker push 021913935619.dkr.ecr.ap-south-1.amazonaws.com/ecs-node-app:latest
      - echo Build completed successfully.